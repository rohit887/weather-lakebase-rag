command: ["python", "app.py"]
env:
  # --- Native Postgres role (password auth) ---
  - name: PGHOST
    value: "ep-round-butterfly-d8iwgyc5.database.us-east-2.cloud.databricks.com"
  - name: PGDATABASE
    value: "databricks_postgres"
  - name: PGUSER
    value: "student-weather"
  - name: PGPORT
    value: "5432"
  - name: PGSSLMODE
    value: "require"
  # Password is injected from a Databricks secret -- NEVER inline it here.
  # `valueFrom` references an app "secret" resource (scope+key) named below.
  - name: PGPASSWORD
    valueFrom: "pg-password"
